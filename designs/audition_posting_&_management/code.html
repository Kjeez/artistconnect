<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary: #ee2bad;
        --background: #181116;
        --surface: #271c23;
        --on-surface: #ffffff;
        --on-surface-variant: #b99db0;
        --outline: #392833;
      }
      body {
        font-family: "Be Vietnam Pro", sans-serif;
      }
      .material-icons {
        font-family: "Material Icons";
        font-weight: normal;
        font-style: normal;
        font-size: 24px;display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;-webkit-font-smoothing: antialiased;text-rendering: optimizeLegibility;-moz-osx-font-smoothing: grayscale;font-feature-settings: "liga";
      }
    </style>
<title>TheatreConnect Audition Posting</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface">
<div class="relative flex size-full min-h-screen flex-col dark justify-between group/design-root">
<div class="flex-grow">
<header class="sticky top-0 z-10 bg-background/80 backdrop-blur-sm">
<div class="flex items-center p-4">
<button class="p-2 -ml-2">
<i class="material-icons text-on-surface">arrow_back_ios_new</i>
</button>
<h1 class="flex-1 text-center text-xl font-bold tracking-tight pr-8">
              Post Audition
            </h1>
</div>
</header>
<main class="px-4 pb-4 space-y-4">
<div class="space-y-1">
<label class="text-sm font-medium text-on-surface-variant" for="project-title">Project Title</label>
<input class="form-input w-full rounded-lg border-none bg-outline focus:ring-2 focus:ring-primary h-12 placeholder:text-on-surface-variant/70 px-4 text-base" id="project-title" placeholder="e.g. Macbeth" type="text"/>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-on-surface-variant" for="role">Role</label>
<input class="form-input w-full rounded-lg border-none bg-outline focus:ring-2 focus:ring-primary h-12 placeholder:text-on-surface-variant/70 px-4 text-base" id="role" placeholder="e.g. Lady Macbeth" type="text"/>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-on-surface-variant" for="project-description">Project Description</label>
<textarea class="form-textarea w-full rounded-lg border-none bg-outline focus:ring-2 focus:ring-primary min-h-32 placeholder:text-on-surface-variant/70 p-4 text-base" id="project-description" placeholder="Tell us about your production..."></textarea>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-on-surface-variant" for="role-requirements">Role Requirements</label>
<textarea class="form-textarea w-full rounded-lg border-none bg-outline focus:ring-2 focus:ring-primary min-h-32 placeholder:text-on-surface-variant/70 p-4 text-base" id="role-requirements" placeholder="What are you looking for in an actor?"></textarea>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<label class="text-sm font-medium text-on-surface-variant" for="audition-location">Location</label>
<input class="form-input w-full rounded-lg border-none bg-outline focus:ring-2 focus:ring-primary h-12 placeholder:text-on-surface-variant/70 px-4 text-base" id="audition-location" placeholder="Delhi-NCR" type="text"/>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-on-surface-variant" for="application-deadline">Deadline</label>
<input class="form-input w-full rounded-lg border-none bg-outline focus:ring-2 focus:ring-primary h-12 placeholder:text-on-surface-variant/70 px-4 text-base" id="application-deadline" placeholder="DD/MM/YYYY" type="date"/>
</div>
</div>
<div class="space-y-1">
<label class="text-sm font-medium text-on-surface-variant" for="audition-date">Audition Date</label>
<input class="form-input w-full rounded-lg border-none bg-outline focus:ring-2 focus:ring-primary h-12 placeholder:text-on-surface-variant/70 px-4 text-base" id="audition-date" placeholder="DD/MM/YYYY" type="date"/>
</div>
<div class="flex pt-4">
<button class="flex w-full cursor-pointer items-center justify-center rounded-lg h-14 px-6 bg-primary text-white text-base font-bold tracking-wide shadow-lg shadow-primary/30 hover:bg-opacity-90 transition-all duration-300">
            Post Audition
          </button>
</div>
</main>
</div>
<footer class="sticky bottom-0 bg-surface/80 backdrop-blur-sm border-t border-outline pb-safe">
<nav class="flex justify-around items-center h-20">
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-1/5" href="#">
<i class="material-icons">home</i>
<span class="text-xs font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-1/5" href="#">
<i class="material-icons">search</i>
<span class="text-xs font-medium">Search</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-on-surface w-1/5 relative -top-2" href="#">
<div class="bg-primary rounded-full p-3 shadow-lg shadow-primary/40">
<i class="material-icons">add</i>
</div>
<span class="text-xs font-bold text-primary">Post</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-1/5" href="#">
<i class="material-icons">inbox</i>
<span class="text-xs font-medium">Messages</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant w-1/5" href="#">
<i class="material-icons">person_outline</i>
<span class="text-xs font-medium">Profile</span>
</a>
</nav>
</footer>
</div>

</body></html>
