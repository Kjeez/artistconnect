      body {

        --primary-color: #ee2bad;

        --on-surface-variant-color: #b99db0;

<body class="dark bg-bg-color">
<div class="relative flex size-full min-h-screen flex-col justify-between overflow-x-hidden">
<div class="flex-grow">
<header class="sticky top-0 z-10 flex items-center justify-between bg-bg-color p-4">
<button class="text-on-surface-color">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">

<h1 class="text-lg font-bold text-on-surface-color">AI Script Generator</h1>
<div class="w-6"></div>
</header>
<main class="px-4 pb-24 pt-4">
<h2 class="text-2xl font-bold text-on-surface-color">Script Parameters</h2>
<p class="mt-1 text-on-surface-variant-color">Fill in the details below to generate your script.</p>
<form class="mt-8 space-y-6">
<div>
<label class="block text-base font-medium text-on-surface-color" for="genre">Genre</label>
<select class="mt-2 block w-full rounded-lg border-none bg-input-bg-color p-4 text-on-surface-color placeholder:text-on-surface-variant-color focus:outline-none focus:ring-2 focus:ring-primary-color" id="genre" name="genre">
<option>Select Genre</option>
<option>Comedy</option>
<option>Drama</option>
<option>Thriller</option>
<option>Sci-Fi</option>
</select>
</div>
<div>
<label class="block text-base font-medium text-on-surface-color" for="characters">Characters</label>
<input class="mt-2 block w-full rounded-lg border-none bg-input-bg-color p-4 text-on-surface-color placeholder:text-on-surface-variant-color focus:outline-none focus:ring-2 focus:ring-primary-color" id="characters" name="characters" placeholder="e.g., 3" type="number"/>
</div>
<div>
<label class="block text-base font-medium text-on-surface-color" for="setting">Setting</label>
<input class="mt-2 block w-full rounded-lg border-none bg-input-bg-color p-4 text-on-surface-color placeholder:text-on-surface-variant-color focus:outline-none focus:ring-2 focus:ring-primary-color" id="setting" name="setting" placeholder="e.g., A cafe in 1920s Paris" type="text"/>
</div>
<div>
<label class="block text-base font-medium text-on-surface-color" for="plot-points">Plot Points</label>
<textarea class="mt-2 block w-full rounded-lg border-none bg-input-bg-color p-4 text-on-surface-color placeholder:text-on-surface-variant-color focus:outline-none focus:ring-2 focus:ring-primary-color" id="plot-points" name="plot-points" placeholder="Enter key plot points or a brief summary of your story idea." rows="5"></textarea>
</div>
<button class="w-full rounded-lg bg-primary-color py-4 text-center text-base font-bold text-on-surface-color transition-opacity hover:opacity-90" type="submit">
              Generate Script
            </button>
</form>
</main>
</div>
<footer class="fixed bottom-0 left-0 right-0 border-t border-input-bg-color bg-surface-color pb-safe">
