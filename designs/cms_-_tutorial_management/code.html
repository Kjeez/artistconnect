<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Be+Vietnam+Pro%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>TheatreConnect - Create Tutorial</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #ee2bad;
        --secondary-color: #392833;
        --background-color: #181116;
        --text-primary: #ffffff;
        --text-secondary: #b99db0;
      }
      body {
        font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
        background-color: var(--background-color);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="dark">
<div class="relative flex size-full min-h-screen flex-col bg-[var(--background-color)] text-[var(--text-primary)]">
<header class="sticky top-0 z-10 bg-[var(--background-color)]/80 backdrop-blur-sm">
<div class="flex items-center p-4">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-[var(--text-primary)]">
<span class="material-symbols-outlined"> arrow_back_ios_new </span>
</button>
<h1 class="flex-1 text-center text-xl font-bold tracking-tight pr-10">Create Tutorial</h1>
</div>
</header>
<main class="flex-1 px-4 py-6 space-y-6">
<div class="space-y-2">
<label class="text-sm font-medium text-[var(--text-secondary)]" for="tutorial-title">Tutorial Title</label>
<input class="form-input w-full rounded-lg border-none bg-[var(--secondary-color)] p-4 text-base placeholder:text-[var(--text-secondary)] focus:ring-2 focus:ring-[var(--primary-color)]" id="tutorial-title" placeholder="e.g., Mastering Stage Lighting" type="text"/>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-[var(--text-secondary)]" for="tutorial-content">Content</label>
<div class="rounded-lg bg-[var(--secondary-color)]">
<div class="flex items-center space-x-2 border-b border-[var(--background-color)] p-2">
<button class="p-2 rounded-md hover:bg-[var(--background-color)]/50 text-[var(--text-secondary)]">
<span class="material-symbols-outlined text-xl">format_bold</span>
</button>
<button class="p-2 rounded-md hover:bg-[var(--background-color)]/50 text-[var(--text-secondary)]">
<span class="material-symbols-outlined text-xl">format_italic</span>
</button>
<button class="p-2 rounded-md hover:bg-[var(--background-color)]/50 text-[var(--text-secondary)]">
<span class="material-symbols-outlined text-xl">format_underlined</span>
</button>
<button class="p-2 rounded-md hover:bg-[var(--background-color)]/50 text-[var(--text-secondary)]">
<span class="material-symbols-outlined text-xl">format_list_bulleted</span>
</button>
<button class="p-2 rounded-md hover:bg-[var(--background-color)]/50 text-[var(--text-secondary)]">
<span class="material-symbols-outlined text-xl">format_list_numbered</span>
</button>
</div>
<textarea class="form-textarea w-full resize-y rounded-b-lg border-none bg-transparent p-4 min-h-[200px] text-base placeholder:text-[var(--text-secondary)] focus:ring-0" id="tutorial-content" placeholder="Write your tutorial content here..."></textarea>
</div>
</div>
<div class="space-y-4">
<h2 class="text-lg font-bold">Media</h2>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center justify-center space-y-2 rounded-lg bg-[var(--secondary-color)] p-6 text-sm font-medium text-[var(--text-secondary)] transition-colors hover:bg-[var(--primary-color)] hover:text-white">
<span class="material-symbols-outlined text-4xl">add_photo_alternate</span>
<span>Add Image</span>
</button>
<button class="flex flex-col items-center justify-center space-y-2 rounded-lg bg-[var(--secondary-color)] p-6 text-sm font-medium text-[var(--text-secondary)] transition-colors hover:bg-[var(--primary-color)] hover:text-white">
<span class="material-symbols-outlined text-4xl">video_call</span>
<span>Add Video</span>
</button>
</div>
</div>
</main>
<footer class="sticky bottom-0 bg-[var(--background-color)]/80 backdrop-blur-sm p-4">
<div class="flex items-center gap-4">
<button class="flex-1 rounded-lg bg-[var(--secondary-color)] py-3 text-center text-base font-bold text-[var(--text-primary)] transition-colors hover:bg-opacity-80">
            Preview
          </button>
<button class="flex-1 rounded-lg bg-[var(--primary-color)] py-3 text-center text-base font-bold text-[var(--text-primary)] transition-colors hover:bg-opacity-80">
            Publish
          </button>
</div>
</footer>
</div>

</body></html>
