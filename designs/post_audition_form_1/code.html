<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Artisan Stage - Post Audition - Step 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#5e19e6",
            "background-light": "#f6f6f8",
            "background-dark": "#161121",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #443465;
      border-radius: 9999px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: #fff;
      cursor: pointer;
      border-radius: 50%;
      border: 4px solid #5e19e6;
    }
    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: #fff;
      cursor: pointer;
      border-radius: 50%;
      border: 4px solid #5e19e6;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark">
<div class="flex flex-col h-screen min-h-screen font-display text-white">
<header class="flex shrink-0 items-center justify-between bg-background-dark p-4">
<div class="flex w-24 items-center justify-start">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em]">Post Audition</h1>
<div class="flex w-24 items-center justify-end">
</div>
</header>
<div class="px-4 py-2">
<div class="text-xs font-semibold text-[#a593c8] mb-1">Step 2 of 4</div>
<div class="w-full bg-[#443465] rounded-full h-1">
<div class="bg-primary h-1 rounded-full" style="width: 50%"></div>
</div>
</div>
<main class="flex-grow overflow-y-auto px-4">
<div class="flex flex-col gap-4 py-4">
<h2 class="tracking-light text-left text-[32px] font-bold leading-tight">Now, let's get into the role details.</h2>
<div class="flex w-full flex-col gap-2 py-2">
<label class="text-base font-medium leading-normal text-white" for="role-name">Role Name <span class="text-red-400">*</span></label>
<input class="form-input h-14 w-full resize-none overflow-hidden rounded-xl border-none bg-[#302447] p-4 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="role-name" placeholder="e.g., 'Norma Desmond' or 'Lead Vocalist'" value=""/>
</div>
<div class="flex flex-col gap-4 py-2">
<p class="text-base font-medium leading-normal text-white">Role Type <span class="text-red-400">*</span></p>
<div class="flex flex-wrap items-center gap-3">
<button class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white">Lead</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Supporting</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Background</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Ensemble</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Understudy</button>
</div>
</div>
<div class="flex w-full flex-col gap-2 py-2">
<label class="text-base font-medium leading-normal text-white" for="character-breakdown">Character Breakdown <span class="text-red-400">*</span></label>
<textarea class="form-textarea h-36 w-full resize-none overflow-hidden rounded-xl border-none bg-[#302447] p-4 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="character-breakdown" placeholder="Describe the character's personality, backstory, and objectives. Be as detailed as possible."></textarea>
</div>
<div class="flex flex-col gap-6 rounded-xl bg-[#302447] p-4">
<p class="text-base font-bold leading-normal text-white">Demographics</p>
<div class="flex flex-col gap-4">
<p class="text-base font-medium leading-normal text-white">Gender</p>
<div class="flex flex-wrap items-center gap-3">
<button class="rounded-full bg-[#443465] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Male</button>
<button class="rounded-full bg-[#443465] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Female</button>
<button class="rounded-full bg-[#443465] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Non-binary</button>
<button class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white">Any</button>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex justify-between items-center">
<p class="text-base font-medium leading-normal text-white">Age Range</p>
<p class="text-base font-bold leading-normal text-white">18 - 65+</p>
</div>
<input class="w-full" max="65" min="18" type="range" value="40"/>
</div>
</div>
<div class="flex w-full flex-col gap-2 py-2">
<label class="text-base font-medium leading-normal text-white" for="skills">Skills Required <span class="text-[#a593c8] text-sm font-normal">(Crucial for AI Matching)</span></label>
<div class="flex flex-wrap items-center gap-2 rounded-xl bg-[#302447] p-3">
<span class="flex items-center gap-1.5 rounded-md bg-primary py-1 pl-3 pr-2 text-sm font-semibold text-white">Stage Combat <button class="text-base"><span class="material-symbols-outlined !text-lg !font-semibold">close</span></button></span>
<span class="flex items-center gap-1.5 rounded-md bg-primary py-1 pl-3 pr-2 text-sm font-semibold text-white">Singing (Soprano) <button class="text-base"><span class="material-symbols-outlined !text-lg !font-semibold">close</span></button></span>
<input class="flex-grow bg-transparent p-1 text-sm text-white placeholder:text-[#a593c8] focus:outline-none" id="skills" placeholder="e.g., 'Hindi', 'Dance (Ballet)'" type="text"/>
</div>
</div>
<div class="flex flex-col gap-4 rounded-xl bg-[#302447] p-4">
<p class="text-base font-bold leading-normal text-white">Compensation &amp; Location</p>
<div class="flex flex-col gap-4">
<p class="text-base font-medium leading-normal text-white">Payment</p>
<div class="flex flex-col gap-4" role="radiogroup">
<label class="flex items-center gap-3">
<input class="form-radio h-5 w-5 rounded-full border-2 border-[#a593c8] bg-transparent text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" name="payment" type="radio" value="paid"/>
<span class="text-base font-normal text-white">Paid</span>
</label>
<div class="pl-8">
<input class="form-input h-12 w-full resize-none overflow-hidden rounded-xl border-none bg-[#161121] p-3 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" placeholder="Specify rate, e.g., '$500/day'"/>
</div>
<label class="flex items-center gap-3">
<input checked="" class="form-radio h-5 w-5 rounded-full border-2 border-[#a593c8] bg-transparent text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" name="payment" type="radio" value="unpaid"/>
<span class="text-base font-normal text-white">Unpaid</span>
</label>
<label class="flex items-center gap-3">
<input class="form-radio h-5 w-5 rounded-full border-2 border-[#a593c8] bg-transparent text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" name="payment" type="radio" value="stipend"/>
<span class="text-base font-normal text-white">Stipend</span>
</label>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-base font-medium leading-normal text-white" for="location">Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#a593c8]">location_on</span>
<input class="form-input h-14 w-full rounded-xl border-none bg-[#161121] p-4 pl-12 text-base font-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="location" placeholder="Search for a location..."/>
</div>
<label class="mt-2 flex items-center gap-3">
<input class="form-checkbox h-5 w-5 rounded border-2 border-[#a593c8] bg-transparent text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" type="checkbox"/>
<span class="text-base font-normal text-white">Remote / Work From Home</span>
</label>
</div>
</div>
</div>
</main>
<footer class="mt-auto shrink-0 border-t border-white/10 bg-background-dark p-4">
<div class="flex items-center gap-4">
<button class="h-14 w-1/3 rounded-lg border border-white/20 bg-transparent text-center text-base font-bold text-white transition-colors hover:bg-white/10">Back</button>
<button class="h-14 w-2/3 rounded-lg bg-primary text-center text-base font-bold text-white transition-opacity hover:opacity-90">Next: Application Requirements</button>
</div>
</footer>
</div>

</body></html>
