<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Be+Vietnam+Pro%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #ee2bad;
        --secondary-color: #392833;
        --text-primary: #ffffff;
        --text-secondary: #b99db0;
        --background-color: #120c10;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #392833;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary-color);
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[var(--background-color)]">
<div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden" style='font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;'>
<div>
<header class="sticky top-0 z-10 bg-[var(--background-color)]/80 backdrop-blur-sm">
<div class="flex items-center p-4 justify-between">
<button class="text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-white/10 transition-colors" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
</svg>
</button>
<h1 class="text-xl font-bold leading-tight tracking-[-0.015em] text-center text-[var(--text-primary)]">Profile Settings</h1>
<div class="w-10"></div>
</div>
</header>
<main>
<div class="p-6">
<h2 class="text-lg font-bold text-[var(--text-primary)] mb-4">Activity Feed Visibility</h2>
<p class="text-[var(--text-secondary)] text-sm mb-6">Manage what your connections see in their activity feed.</p>
<div class="space-y-4">
<div class="flex items-center justify-between bg-[var(--secondary-color)]/50 p-4 rounded-lg">
<div>
<h3 class="text-[var(--text-primary)] font-semibold">Event Bookings</h3>
<p class="text-[var(--text-secondary)] text-sm">When you book a ticket for an event</p>
</div>
<label class="switch">
<input checked="true" type="checkbox"/>
<span class="slider"></span>
</label>
</div>
<div class="flex items-center justify-between bg-[var(--secondary-color)]/50 p-4 rounded-lg">
<div>
<h3 class="text-[var(--text-primary)] font-semibold">Saved Events</h3>
<p class="text-[var(--text-secondary)] text-sm">When you save an event to your list</p>
</div>
<label class="switch">
<input checked="true" type="checkbox"/>
<span class="slider"></span>
</label>
</div>
<div class="flex items-center justify-between bg-[var(--secondary-color)]/50 p-4 rounded-lg">
<div>
<h3 class="text-[var(--text-primary)] font-semibold">Expressions of Interest</h3>
<p class="text-[var(--text-secondary)] text-sm">When you show interest in a project</p>
</div>
<label class="switch">
<input type="checkbox"/>
<span class="slider"></span>
</label>
</div>
</div>
</div>
</main>
</div>
<footer class="sticky bottom-0 bg-[#1a1418]/80 backdrop-blur-sm border-t border-[var(--secondary-color)]">
<nav class="flex justify-around items-center pt-2 pb-3">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-[var(--text-secondary)]" href="#">
<div class="flex h-8 items-center justify-center" data-icon="House" data-size="24px" data-weight="regular">
<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M218.83,103.77l-80-75.48a1.14,1.14,0,0,1-.11-.11,16,16,0,0,0-21.53,0l-.11.11L37.17,103.77A16,16,0,0,0,32,115.55V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V160h32v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V115.55A16,16,0,0,0,218.83,103.77ZM208,208H160V160a16,16,0,0,0-16-16H112a16,16,0,0,0-16,16v48H48V115.55l.11-.1L128,40l79.9,75.43.11.1Z"></path>
</svg>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-[var(--text-secondary)]" href="#">
<div class="flex h-8 items-center justify-center" data-icon="Calendar" data-size="24px" data-weight="regular">
<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Zm-96-88v64a8,8,0,0,1-16,0V132.94l-4.42,2.22a8,8,0,0,1-7.16-14.32l16-8A8,8,0,0,1,112,120Zm59.16,30.45L152,176h16a8,8,0,0,1,0,16H136a8,8,0,0,1-6.4-12.8l28.78-38.37A8,8,0,1,0,145.07,132a8,8,0,1,1-13.85-8A24,24,0,0,1,176,136,23.76,23.76,0,0,1,171.16,150.45Z"></path>
</svg>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Events</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-[var(--text-secondary)]" href="#">
<div class="flex h-8 items-center justify-center" data-icon="File" data-size="24px" data-weight="regular">
<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">

</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Scripts</p>
</a>
<a class="relative flex flex-1 flex-col items-center justify-end gap-1 text-[var(--primary-color)]" href="#">
<span class="absolute top-0 w-8 h-1 bg-[var(--primary-color)] rounded-full"></span>
<div class="flex h-8 items-center justify-center" data-icon="User" data-size="24px" data-weight="fill">
<svg fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">

</svg>
</div>
<p class="text-xs font-bold leading-normal tracking-[0.015em]">Profile</p>
</a>
</nav>
</footer>
</div>
</body></html>
