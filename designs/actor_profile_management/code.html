<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Be+Vietnam+Pro%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --theme-primary: #ee2bad;
        --theme-background: #181116;
        --theme-text-primary: #ffffff;
        --theme-text-secondary: #b99db0;
        --theme-surface: #392833;
        --theme-surface-light: #2a1e26;
      }
      body {
        background-color: var(--theme-background);
        color: var(--theme-text-primary);
        font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
      }
      .form-input-custom {
        @apply w-full flex-1 resize-none overflow-hidden rounded-lg border-none bg-[var(--theme-surface)] p-4 text-base font-normal leading-normal text-[var(--theme-text-primary)] placeholder:text-[var(--theme-text-secondary)] focus:border-none focus:outline-0 focus:ring-2 focus:ring-[var(--theme-primary)];
      }
      .btn-primary {
        @apply flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-[var(--theme-primary)] px-5 py-3 text-base font-bold leading-normal tracking-[0.015em] text-[var(--theme-text-primary)] transition-colors hover:bg-opacity-80;
      }
      .btn-secondary {
        @apply flex cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-[var(--theme-surface)] px-4 py-2 text-sm font-medium leading-normal text-[var(--theme-text-primary)] transition-colors hover:bg-[var(--theme-surface-light)];
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex size-full min-h-screen flex-col justify-between overflow-x-hidden">
<main class="flex-grow">
<header class="sticky top-0 z-10 flex items-center justify-between bg-[var(--theme-background)] p-4">
<button class="flex size-10 items-center justify-center text-[var(--theme-text-primary)]">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
</svg>
</button>
<h1 class="text-xl font-bold leading-tight tracking-tight">Edit Profile</h1>
<div class="size-10"></div>
</header>
<div class="p-4">
<div class="mb-8 flex flex-col items-center gap-4">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-32" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuC05ctclWyD1p8fLf-apBW1VDE84IKxHq8fNyTGxFeKITvCMWhX7kez8uf_8pfP2iF4gLnwmV9ulxV5Ls8jwEoKpuvjiXb6ZoSbPTnUhdkpHWkHhYrSCdQa-yCp7Jud72Jn4AgZlquzc0EU9px4W3zPC4wu0gYrvH9Mnwnv7n-YeOylUFRzK_5YObKC04ab65oZn6EEPdL00n_XWsRx3Z4q-vKIsKJ0QmYBWwR2DQq0sfd_vVWN8-tXFuWipClZvtDWwSCzWmEvDpM");'></div>
<button class="absolute bottom-0 right-0 flex size-8 items-center justify-center rounded-full bg-[var(--theme-primary)] text-white">
<svg fill="currentColor" height="16" viewBox="0 0 256 256" width="16" xmlns="http://www.w3.org/2000/svg">
<path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,164v40a16,16,0,0,0,16,16H92a15.86,15.86,0,0,0,12-4.69L227.31,96a16,16,0,0,0,0-22.63ZM92,208H48V164l91.31-91.31,44,44ZM192,108.63,148,64.63,170.31,42.3a8,8,0,0,1,11.32,0l22.62,22.63a8,8,0,0,1,0,11.32Z"></path>
</svg>
</button>
</div>
<div class="text-center">
<p class="text-2xl font-bold">Arjun Kapoor</p>
<p class="text-[var(--theme-text-secondary)]">Actor, Delhi, India</p>
</div>
</div>
<div class="space-y-6">
<div>
<h2 class="mb-4 text-lg font-bold">Basic Information</h2>
<div class="space-y-4">
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col">
<span class="mb-2 text-sm font-medium text-[var(--theme-text-secondary)]">Age Range</span>
<input class="form-input-custom h-14" placeholder="e.g., 25-35"/>
</label>
<label class="flex flex-col">
<span class="mb-2 text-sm font-medium text-[var(--theme-text-secondary)]">Gender</span>
<select class="form-input-custom h-14">
<option value="">Select Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>
</label>
</div>
</div>
</div>
<div>
<h2 class="mb-4 text-lg font-bold">Skills</h2>
<textarea class="form-input-custom min-h-36" placeholder="e.g., Singing, Dancing, Accents (British, American), Martial Arts..."></textarea>
</div>
<div>
<h2 class="mb-4 text-lg font-bold">Experience</h2>
<textarea class="form-input-custom min-h-36" placeholder="List your previous roles, productions, and training."></textarea>
</div>
<div>
<h2 class="mb-4 text-lg font-bold">Media</h2>
<div class="space-y-4">
<div class="flex items-center gap-4 rounded-lg bg-[var(--theme-surface-light)] p-4">
<div class="flex size-12 shrink-0 items-center justify-center rounded-lg bg-[var(--theme-surface)] text-[var(--theme-text-primary)]">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z"></path>
</svg>
</div>
<div class="flex-grow">
<p class="font-medium">Headshots</p>
<p class="text-sm text-[var(--theme-text-secondary)]">Upload professional headshots</p>
</div>
<button class="btn-secondary shrink-0">Upload</button>
</div>
<div class="flex items-center gap-4 rounded-lg bg-[var(--theme-surface-light)] p-4">
<div class="flex size-12 shrink-0 items-center justify-center rounded-lg bg-[var(--theme-surface)] text-[var(--theme-text-primary)]">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M164.44,105.34l-48-32A8,8,0,0,0,104,80v64a8,8,0,0,0,12.44,6.66l48-32a8,8,0,0,0,0-13.32ZM120,129.05V95l25.58,17ZM216,40H40A16,16,0,0,0,24,56V168a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,128H40V56H216V168Zm16,40a8,8,0,0,1-8,8H32a8,8,0,0,1,0-16H224A8,8,0,0,1,232,208Z"></path>
</svg>
</div>
<div class="flex-grow">
<p class="font-medium">Showreel</p>
<p class="text-sm text-[var(--theme-text-secondary)]">Showcase your acting range</p>
</div>
<button class="btn-secondary shrink-0">Upload</button>
</div>
</div>
</div>
</div>
</div>
</main>
<footer class="sticky bottom-0 bg-[var(--theme-background)] p-4 pt-2">
<button class="btn-primary">Save Changes</button>
</footer>
</div>

</body></html>
