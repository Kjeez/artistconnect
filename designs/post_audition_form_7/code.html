<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Artisan Stage - Post Audition - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#5e19e6",
            "background-light": "#f6f6f8",
            "background-dark": "#161121",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark">
<div class="flex flex-col h-screen min-h-screen font-display text-white">
<header class="flex shrink-0 items-center justify-between bg-background-dark p-4">
<div class="flex w-24 items-center justify-start">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em]">Post Audition</h1>
<div class="flex w-24 items-center justify-end">
<button class="text-base font-bold leading-normal text-[#a593c8]">Save Draft</button>
</div>
</header>
<div class="px-4 py-2">
<div class="text-xs font-semibold text-[#a593c8] mb-1">Step 1 of 4</div>
<div class="w-full bg-[#443465] rounded-full h-1">
<div class="bg-primary h-1 rounded-full" style="width: 25%"></div>
</div>
</div>
<main class="flex-grow overflow-y-auto px-4">
<div class="flex flex-col gap-4 py-4">
<h2 class="tracking-light text-left text-[32px] font-bold leading-tight">First, tell us about the project.</h2>
<div class="flex w-full flex-col gap-2 py-2">
<label class="text-base font-medium leading-normal text-white" for="project-title">Project Title <span class="text-red-400">*</span></label>
<input class="form-input h-14 w-full resize-none overflow-hidden rounded-xl border-none bg-[#302447] p-4 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="project-title" placeholder="e.g., 'Sunset Boulevard' Stage Play" value=""/>
</div>
<div class="flex flex-col gap-4 py-2">
<p class="text-base font-medium leading-normal text-white">Production Type <span class="text-red-400">*</span></p>
<div class="flex flex-wrap items-center gap-3">
<button class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white">Film</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Theatre</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Web Series</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Commercial</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Music Video</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Voice Over</button>
</div>
</div>
<div class="flex w-full flex-col gap-2 py-2">
<label class="text-base font-medium leading-normal text-white" for="production-company">Production Company / Director</label>
<input class="form-input h-14 w-full resize-none overflow-hidden rounded-xl border-none bg-[#302447] p-4 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="production-company" placeholder="e.g., 'Starlight Productions'" value="Your Company Name"/>
</div>
<div class="flex w-full flex-col gap-2 py-2">
<label class="text-base font-medium leading-normal text-white" for="project-synopsis">Project Synopsis</label>
<textarea class="form-textarea h-36 w-full resize-none overflow-hidden rounded-xl border-none bg-[#302447] p-4 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="project-synopsis" placeholder="A brief summary of the story and theme."></textarea>
</div>
<div class="flex flex-col gap-4 py-2">
<p class="text-base font-medium leading-normal text-white">Project Genre</p>
<div class="flex flex-wrap items-center gap-3">
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Drama</button>
<button class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white">Comedy</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Thriller</button>
<button class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white">Musical</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Sci-Fi</button>
<button class="flex items-center gap-1 rounded-full border border-dashed border-[#a593c8] bg-transparent px-4 py-2.5 text-sm font-medium text-[#a593c8]">
<span class="material-symbols-outlined text-base">add</span>
              Add Genre
            </button>
</div>
</div>
<div class="flex flex-col gap-4 py-2">
<label class="text-base font-medium leading-normal text-white" for="attachments">Attachments <span class="text-[#a593c8] font-normal">(Optional)</span></label>
<button class="flex h-14 w-full items-center justify-center gap-2 rounded-xl border-2 border-dashed border-[#443465] bg-transparent text-center text-sm font-semibold text-white transition-colors hover:bg-[#302447]">
<span class="material-symbols-outlined">upload_file</span>
            Attach Full Script or Project Lookbook
          </button>
</div>
</div>
</main>
<footer class="mt-auto shrink-0 border-t border-white/10 bg-background-dark p-4">
<button class="h-14 w-full rounded-lg bg-primary text-center text-base font-bold text-white transition-opacity hover:opacity-90">Next: Describe the Role</button>
</footer>
</div>

</body></html>
