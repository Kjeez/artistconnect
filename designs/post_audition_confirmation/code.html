<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Audition Posted Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#5e19e6",
            "background-light": "#f6f6f8",
            "background-dark": "#161121",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col text-[#F5F5F5] dark group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<header class="flex items-center bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="flex w-12 items-center">
<button class="flex items-center justify-center rounded-full h-10 w-10 text-[#F5F5F5]">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<h1 class="text-[#F5F5F5] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Confirmation</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex items-center justify-center rounded-full h-10 w-10 text-[#F5F5F5]">
<span class="material-symbols-outlined text-2xl">share</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex flex-grow flex-col items-center justify-center px-6 py-8">
<div class="flex w-full max-w-md flex-col items-center gap-8 text-center">
<!-- Success Icon & Message -->
<div class="flex flex-col items-center gap-4">
<div data-alt="A large, glowing gold checkmark icon indicating success.">
<span class="material-symbols-outlined text-8xl font-thin bg-gradient-to-br from-[#D4AF37] to-[#B87333] bg-clip-text text-transparent">
              check_circle
            </span>
</div>
<div class="flex flex-col items-center gap-2">
<p class="text-[#F5F5F5] text-2xl font-bold leading-tight tracking-[-0.015em]">Audition Posted Successfully!</p>
<p class="text-[#AAAAAA] text-base font-normal leading-normal">Your listing is now live. Let the casting begin.</p>
</div>
</div>
<!-- Audition Summary Card -->
<div class="w-full rounded-xl border border-[#AAAAAA]/20 bg-white/5 p-5">
<div class="grid gap-y-4">
<div class="grid grid-cols-[auto_1fr] items-center gap-x-4 border-b border-b-[#AAAAAA]/20 pb-4">
<p class="text-[#AAAAAA] text-sm font-normal leading-normal uppercase tracking-wider">AUDITION</p>
<p class="text-[#F5F5F5] text-sm font-semibold leading-normal text-right truncate">The Tempest</p>
</div>
<div class="grid grid-cols-[auto_1fr] items-center gap-x-4 pt-0">
<p class="text-[#AAAAAA] text-sm font-normal leading-normal uppercase tracking-wider">ROLE</p>
<p class="text-[#F5F5F5] text-sm font-semibold leading-normal text-right truncate">Ariel</p>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Action Buttons -->
<footer class="sticky bottom-0 w-full bg-background-dark/80 backdrop-blur-sm">
<div class="flex flex-col gap-3 px-4 py-6">
<button class="flex h-12 w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-gradient-to-r from-[#D4AF37] to-[#B87333] px-5 text-zinc-900 text-base font-bold leading-normal tracking-[0.015em] transition-opacity hover:opacity-90">
<span class="truncate">View Audition Listing</span>
</button>
<button class="flex h-12 w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl border border-[#AAAAAA]/50 bg-transparent px-5 text-[#AAAAAA] text-base font-bold leading-normal tracking-[0.015em] transition-colors hover:bg-[#AAAAAA]/10 hover:text-[#F5F5F5]">
<span class="truncate">Manage All Auditions</span>
</button>
</div>
</footer>
</div>
</body></html>
