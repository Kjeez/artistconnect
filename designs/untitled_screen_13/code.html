<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>Stitch Design</title>

      :root {
        --primary-color: #ee2bad;
        --background-color: #181116;
        --card-background-color: #271c23;
        --text-primary-color: #ffffff;
        --text-secondary-color: #b99db0;
        --accent-color: #392833;
      }
    </style>

      min-height: max(884px, 100dvh);

<body class="bg-[var(--background-color)]">
<div class="relative flex size-full min-h-screen flex-col justify-between group/design-root overflow-x-hidden" style='font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;'>
<div class="flex-grow">
<header class="sticky top-0 z-10 bg-[var(--background-color)]/80 backdrop-blur-sm">
<div class="flex items-center p-4 justify-between">
<div class="w-12"></div>
<h1 class="text-[var(--text-primary-color)] text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Explore</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex items-center justify-center h-12 w-12 text-[var(--text-primary-color)]">
<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<path d="M120,128a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16h64A8,8,0,0,1,120,128Zm88-56H48a8,8,0,0,0,0,16H208a8,8,0,0,0,0-16Zm0,96H152a8,8,0,0,0,0,16h56a8,8,0,0,0,0-16Z"></path>
</svg>
</button>
</div>
</div>
</header>
<main class="px-4 pb-24">
<section class="mt-5">
<h2 class="text-[var(--text-primary-color)] text-2xl font-bold leading-tight tracking-[-0.015em] mb-4">Event Marketplace</h2>
<div class="space-y-4">
<div class="relative">
<input class="w-full h-12 px-4 pr-12 bg-[var(--card-background-color)] rounded-full text-[var(--text-primary-color)] placeholder:text-[var(--text-secondary-color)] border-0 focus:ring-2 focus:ring-[var(--primary-color)] focus:outline-none" placeholder="Search for DJs, anchors..." type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3">
<svg class="w-6 h-6 text-[var(--text-secondary-color)]" fill="currentColor" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
</svg>
</div>
</div>
<div class="flex gap-2">
<select class="flex-1 bg-[var(--card-background-color)] text-[var(--text-secondary-color)] rounded-full border-0 focus:ring-2 focus:ring-[var(--primary-color)] h-10 px-4 text-sm">
<option>Talent Type</option>
<option>DJ</option>
<option>Anchor</option>
<option>Singer</option>
</select>
<select class="flex-1 bg-[var(--card-background-color)] text-[var(--text-secondary-color)] rounded-full border-0 focus:ring-2 focus:ring-[var(--primary-color)] h-10 px-4 text-sm">
<option>Availability</option>
<option>Today</option>
<option>This Week</option>
<option>This Month</option>
</select>
</div>
<div class="flex gap-2">
<select class="flex-1 bg-[var(--card-background-color)] text-[var(--text-secondary-color)] rounded-full border-0 focus:ring-2 focus:ring-[var(--primary-color)] h-10 px-4 text-sm">
<option>Price Range</option>
<option>$</option>
<option>$$</option>
<option>$$$</option>
</select>
<select class="flex-1 bg-[var(--card-background-color)] text-[var(--text-secondary-color)] rounded-full border-0 focus:ring-2 focus:ring-[var(--primary-color)] h-10 px-4 text-sm">
<option>Rating</option>
<option>4+ Stars</option>
<option>3+ Stars</option>
<option>Any</option>
</select>
</div>
<button class="w-full flex items-center justify-center rounded-full h-11 px-5 bg-[var(--primary-color)] text-[var(--text-primary-color)] text-base font-bold leading-normal shadow-lg shadow-[var(--primary-color)]/20 transition-transform hover:scale-105">Find Talent</button>
</div>
</section>
<section class="mt-10">
<h2 class="text-[var(--text-primary-color)] text-2xl font-bold leading-tight tracking-[-0.015em] mb-4">Featured Talent</h2>
<div class="grid grid-cols-2 gap-4">
<div class="bg-[var(--card-background-color)] rounded-2xl p-3">
<div class="relative mb-2">
<img alt="DJ Riya" class="w-full h-32 object-cover rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9E4-5Z5S4W5G6F7H8I9J0K1L2M3N4O5P6Q7R8S9T0U1V2W3X4Y5Z6_w_h_g_f_e_d_c_b_a_A_a-zA-Z0-9_-=s0"/>
<div class="absolute top-2 right-2 flex items-center gap-1 bg-black/50 backdrop-blur-sm rounded-full px-2 py-0.5">
<svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
<span class="text-white text-xs font-bold">4.8</span>
</div>
</div>
<h3 class="text-white font-bold text-sm">DJ Riya</h3>
<p class="text-[var(--text-secondary-color)] text-xs">Electronic, Bollywood</p>
<p class="text-white font-bold text-sm mt-1">$150/hr</p>
</div>
<div class="bg-[var(--card-background-color)] rounded-2xl p-3">
<div class="relative mb-2">
<img alt="Anchor Aman" class="w-full h-32 object-cover rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z-s-w-h-g-f-e-d-c-b-a-9-8-7-6-5-4-3-2-1=s0"/>
<div class="absolute top-2 right-2 flex items-center gap-1 bg-black/50 backdrop-blur-sm rounded-full px-2 py-0.5">
<svg class="w-3 h-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
<span class="text-white text-xs font-bold">4.9</span>
</div>
</div>
<h3 class="text-white font-bold text-sm">Anchor Aman</h3>
<p class="text-[var(--text-secondary-color)] text-xs">Weddings, Corporate</p>
<p class="text-white font-bold text-sm mt-1">$200/hr</p>
</div>
</div>
</section>
<section class="mt-10">
<h2 class="text-[var(--text-primary-color)] text-2xl font-bold leading-tight tracking-[-0.015em] mb-4">Community Hub</h2>
<div class="grid grid-cols-1 gap-6">
<div class="bg-[var(--card-background-color)] rounded-2xl p-5 flex flex-col items-start gap-3">
<h3 class="text-[var(--text-primary-color)] text-lg font-bold">Gamified Challenges</h3>
<p class="text-[var(--text-secondary-color)] text-sm">Participate in challenges, earn rewards, and connect with fellow artists.</p>
<button class="mt-auto flex items-center justify-center rounded-full h-9 px-5 bg-[var(--primary-color)] text-[var(--text-primary-color)] text-sm font-bold leading-normal shadow-lg shadow-[var(--primary-color)]/20 transition-transform hover:scale-105">Explore</button>
</div>
</div>
</section>
</main>
</div>
<footer class="fixed bottom-0 left-0 right-0 z-10">
<div class="bg-[var(--card-background-color)]/90 backdrop-blur-lg border-t border-[var(--accent-color)] mx-4 mb-4 rounded-full shadow-2xl shadow-black/50">
<div class="flex justify-around items-center h-16">
<a class="flex flex-col items-center justify-center gap-1 text-[var(--primary-color)]" href="#">
<div class="h-6 w-6">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M240,117.29,136,22.8a16,16,0,0,0-24,0L20,115.55a16,16,0,0,0-5.17,11.78V208a16,16,0,0,0,16,16H88a16,16,0,0,0,16-16V168a8,8,0,0,1,8-8h40a8,8,0,0,1,8,8v40a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V127.33A16,16,0,0,0,240,117.29ZM224,208H184V168a24,24,0,0,0-24-24H96a24,24,0,0,0-24,24v40H40V127.33l1.29-1.29L128,43.55l86.74,82.49L216,127.33V208Z"></path>
</svg>
</div>
<p class="text-xs font-medium">Explore</p>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-[var(--text-secondary-color)] transition-colors hover:text-[var(--primary-color)]" href="#">
<div class="h-6 w-6">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM48,48H72v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48ZM208,208H48V96H208V208Z"></path>
</svg>
</div>
<p class="text-xs font-medium">Events</p>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-[var(--text-secondary-color)] transition-colors hover:text-[var(--primary-color)]" href="#">
<div class="h-6 w-6">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M208,24H88a16,16,0,0,0-16,16V80H48a16,16,0,0,0-16,16v96a16,16,0,0,0,16,16H168a16,16,0,0,0,16-16V160h24a16,16,0,0,0,16-16V40A16,16,0,0,0,208,24ZM88,40H208V144H184a16,16,0,0,0-16,16v24H48V96H72a16,16,0,0,0,16-16V40Z"></path>
</svg>
</div>
<p class="text-xs font-medium">Scripts</p>
</a>
<a class="flex flex-col items-center justify-center gap-1 text-[var(--text-secondary-color)] transition-colors hover:text-[var(--primary-color)]" href="#">
<div class="h-6 w-6">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M128,24a104,104,0,1,0,104,104A104.11,104.11,0,0,0,128,24ZM72.23,194a80.31,80.31,0,0,1,111.54,0,87.35,87.35,0,0,1-111.54,0ZM96,120a32,32,0,1,1,32,32A32,32,0,0,1,96,120Zm97.77,66a87.43,87.43,0,0,1-131.54,0,88,88,0,1,1,131.54,0Z"></path>
</svg>
</div>
<p class="text-xs font-medium">Profile</p>
</a>
</div>
</div>
</footer>
</div>

</body></html>
