<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Artisan Stage - Post Audition</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#5e19e6",
              "background-light": "#f6f6f8",
              "background-dark": "#161121",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark">
<div class="flex flex-col h-screen min-h-screen font-display text-white">
<!-- Top App Bar -->
<header class="flex shrink-0 items-center justify-between bg-background-dark p-4">
<div class="flex w-24 items-center justify-start">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em]">Post Audition</h1>
<div class="flex w-24 items-center justify-end">
<button class="text-base font-bold leading-normal text-[#a593c8]">Save Draft</button>
</div>
</header>
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 pt-2 pb-5">
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-[#443465]"></div>
<div class="h-2 w-2 rounded-full bg-[#443465]"></div>
<div class="h-2 w-2 rounded-full bg-[#443465]"></div>
<div class="h-2 w-2 rounded-full bg-[#443465]"></div>
</div>
<!-- Form Content -->
<main class="flex-grow overflow-y-auto">
<div class="flex flex-col gap-4">
<!-- Headline Text -->
<h2 class="tracking-light px-4 pt-4 text-left text-[32px] font-bold leading-tight">The Basics</h2>
<!-- Audition Title Field -->
<div class="flex w-full flex-col gap-2 px-4 py-3">
<label class="text-base font-medium leading-normal text-white" for="audition-title">Audition Title</label>
<input class="form-input h-14 w-full resize-none overflow-hidden rounded-xl border-none bg-[#302447] p-4 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="audition-title" placeholder="e.g., Lead Role for Indie Film" value=""/>
</div>
<!-- Project Type Section -->
<div class="flex flex-col gap-4 px-4 py-3">
<p class="text-base font-normal leading-normal text-white">Project Type</p>
<div class="flex flex-wrap items-center gap-3">
<button class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white">Film</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Theatre</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Commercial</button>
<button class="rounded-full bg-[#302447] px-5 py-2.5 text-sm font-medium text-[#a593c8]">Web Series</button>
</div>
</div>
<!-- Role Description Field -->
<div class="flex w-full flex-col gap-2 px-4 py-3">
<label class="text-base font-medium leading-normal text-white" for="role-description">Role Description</label>
<textarea class="form-textarea h-36 w-full resize-none overflow-hidden rounded-xl border-none bg-[#302447] p-4 text-base font-normal leading-normal text-white placeholder:text-[#a593c8] focus:border-none focus:outline-0 focus:ring-0" id="role-description" placeholder="Describe the character, personality, key traits, and what you're looking for in an actor."></textarea>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<footer class="mt-auto shrink-0 border-t border-white/10 bg-background-dark p-4">
<button class="h-14 w-full rounded-lg bg-primary text-center text-base font-bold text-white transition-opacity hover:opacity-90">Next</button>
</footer>
</div>
</body></html>
