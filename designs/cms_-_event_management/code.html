<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TheatreConnect - Create Event</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #ee2bad;
        --background-color: #181116;
        --input-background: #392833;
        --text-primary: #ffffff;
        --text-secondary: #b99db0;
        --border-color: #533e4c;
      }
      body {
        font-family: 'Be Vietnam Pro', sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
      }
      .form-input {
        @apply w-full rounded-lg bg-[var(--input-background)] border border-[var(--border-color)] px-4 py-3 text-base text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)] transition-colors duration-300;
      }
      .btn {
        @apply flex w-full cursor-pointer items-center justify-center rounded-lg h-12 px-6 text-base font-bold leading-normal tracking-wide transition-colors duration-300;
      }
      .btn-primary {
        @apply bg-[var(--primary-color)] text-[var(--text-primary)] hover:bg-opacity-80;
      }
      .btn-secondary {
        @apply bg-transparent border border-[var(--primary-color)] text-[var(--primary-color)] hover:bg-[var(--primary-color)] hover:text-[var(--text-primary)];
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[var(--background-color)]">
<div class="relative flex size-full min-h-screen flex-col">
<header class="sticky top-0 z-10 bg-[var(--background-color)]/80 backdrop-blur-sm">
<div class="flex items-center p-4">
<button class="text-white">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
</svg>
</button>
<h1 class="flex-1 text-center text-xl font-bold text-white pr-6">Create Event</h1>
</div>
</header>
<main class="flex-grow px-4 pb-24">
<form class="space-y-6">
<div>
<label class="mb-2 block text-sm font-medium text-white" for="event-title">Event Title</label>
<input class="form-input" id="event-title" name="event-title" placeholder="e.g., Hamlet in the Park" type="text"/>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-white" for="description">Description</label>
<textarea class="form-input" id="description" name="description" placeholder="A modern adaptation of Shakespeare's classic..." rows="5"></textarea>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="mb-2 block text-sm font-medium text-white" for="date">Date</label>
<input class="form-input" id="date" name="date" type="date"/>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-white" for="time">Time</label>
<input class="form-input" id="time" name="time" type="time"/>
</div>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-white" for="location">Location</label>
<input class="form-input" id="location" name="location" placeholder="e.g., India Habitat Centre, Delhi" type="text"/>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-white" for="image-upload">Event Poster</label>
<div class="flex items-center justify-center w-full">
<label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer border-[var(--border-color)] bg-[var(--input-background)] hover:bg-opacity-80 transition-colors duration-300" for="image-upload">
<div class="flex flex-col items-center justify-center pt-5 pb-6">
<svg aria-hidden="true" class="w-8 h-8 mb-2 text-[var(--text-secondary)]" fill="none" viewBox="0 0 20 16" xmlns="http://www.w3.org/2000/svg">
<path d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<p class="mb-1 text-sm text-[var(--text-secondary)]"><span class="font-semibold">Click to upload</span> or drag and drop</p>
<p class="text-xs text-[var(--text-secondary)]">SVG, PNG, JPG or GIF (MAX. 800x400px)</p>
</div>
<input class="hidden" id="image-upload" type="file"/>
</label>
</div>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-white" for="talent">Talent</label>
<input class="form-input" id="talent" name="talent" placeholder="e.g., Anupam Kher, Naseeruddin Shah" type="text"/>
</div>
</form>
</main>
<footer class="fixed bottom-0 left-0 right-0 bg-[var(--background-color)]/80 backdrop-blur-sm p-4 border-t border-[var(--border-color)]">
<div class="flex items-center gap-4">
<button class="btn btn-secondary flex-1">Preview</button>
<button class="btn btn-primary flex-1">Save Event</button>
</div>
</footer>
</div>

</body></html>
